# Dicee Local Secret Bootstrap Contract
# Last updated: 2026-04-16

policy:
  runtime_app_secrets: "Infisical"
  local_operator_bootstrap_secrets: "1Password"
  non_secret_metadata: "Repo versioned files"
  prohibited:
    - "the legacy local secret store"
    - "persistent shell-secret exports"
    - "repo scripts that write tokens into user-global config files"

onepassword:
  account: "my.1password.com"
  vault: "Dev"
  readiness:
    model: "Desktop app integration, not session-style signin"
    check: "op vault get Dev --account my.1password.com >/dev/null"
    runtime_read: "op read --account my.1password.com op://Dev/<item>/<field>"
  items:
    - name: "dicee-infisical-dev-auth"
      fields: ["client-id", "client-secret"]
    - name: "dicee-infisical-staging-auth"
      fields: ["client-id", "client-secret"]
    - name: "dicee-infisical-prod-auth"
      fields: ["client-id", "client-secret"]
    - name: "dicee-cloudflare-api"
      fields: ["api-token"]
    - name: "dicee-supabase-mcp"
      fields: ["token"]
    - name: "dicee-vercel-api"
      fields: ["token"]
      optional: true
      status: "deferred-until-rotated-or-needed"
    - name: "dicee-partykit-api"
      fields: ["token"]
      optional: true
      status: "deferred-until-rotated-or-needed"
    - name: "dicee-elevenlabs-local"
      fields: ["api-key"]
      optional: true
      status: "deferred-until-rotated-or-needed"

wrappers:
  readiness_check: "./scripts/check-1password-setup.sh"
  infisical_auth: "./scripts/with-dicee-infisical-auth.sh <dev|staging|prod> -- <command>"
  cloudflare: "./scripts/with-dicee-cloudflare.sh -- <command>"
  supabase_mcp: "./scripts/with-dicee-supabase-mcp.sh -- <command>"
  elevenlabs_local: "./scripts/with-dicee-elevenlabs-local.sh -- <command>"

non_secret_metadata:
  file: "scripts/lib/dicee-operator-metadata.sh"
  examples:
    - "Infisical instance URL, project slug, project id"
    - "Infisical identity names and IDs"
    - "Cloudflare account id and domain"
    - "Supabase project ref"
